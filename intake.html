<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提交作品与资料纠错 · 星游集</title><link rel="stylesheet" href="site-nav.css?v=2"><link rel="stylesheet" href="cosmic-theme.css?v=retro3"><link rel="stylesheet" href="community.css?v=1"><link rel="stylesheet" href="site-motion.css?v=station3"><script src="data/resources.js" defer></script><script src="intake.js?v=1" defer></script><script src="station-audio.js?v=4" defer></script><link rel="stylesheet" href="mobile-layout.css?v=2"></head><body data-site-page="intake"><script src="site-nav.js?v=14"></script><main class="intake-page"><a href="about.html#participation">← 回到星游集</a><p class="community-kicker">SHARE YOUR WORLD</p><h1>把你的作品带来。</h1><p class="community-muted">提交新项目，或告诉我们已有档案哪里需要更新。</p><div class="intake-steps">① 填写资料 → ② 复制或下载 → ③ 通过微信交给运营。<br>这里先帮你整理资料，不会自动发送或发布；运营核对后手动更新。</div>
<form id="intakeForm" class="intake-form"><label>资料类型<select name="kind" id="intakeKind"><option value="new">提交新项目</option><option value="correction">更新 / 纠错已有档案</option></select></label><label>对应档案<select name="record" id="intakeRecord"><option value="">新项目无需选择</option></select></label><label>团队名称<input name="team" maxlength="100" required autocomplete="organization"></label><label>作品名称<input name="project" maxlength="150" required></label><label class="wide">作品简介 / 需要修改的内容<textarea name="description" maxlength="3000" required placeholder="纠错时请注明：当前内容、正确内容及依据。"></textarea></label><label>项目阶段<input name="stage" maxlength="60" placeholder="例如：原型 / Demo / 已上线"></label><label>平台<input name="platform" maxlength="100" placeholder="例如：PC / Steam"></label><label class="wide">主页、试玩或素材链接<textarea name="links" maxlength="2000" placeholder="每行一个 http 或 https 链接。可留空。"></textarea><small>请提供可以访问的链接，不要填写账号密码或私密文件访问凭据。</small></label><label class="wide">支持需求 / 补充说明<textarea name="needs" maxlength="2000" placeholder="例如：希望招募美术、寻找发行、预约试玩。"></textarea></label><label class="wide">信息展示意愿<select name="permission" required><option value="">请选择</option><option value="review">仅供运营核对，暂不公开</option><option value="public">同意公开本次提交的作品资料</option></select></label><label class="wide check-label"><input type="checkbox" required>我有权提交这些资料，确认不包含他人的私人联系方式或内部备注。</label><div class="wide"><button type="submit">生成待发送资料</button><p class="community-muted">内容只在当前页面中处理，刷新会清空。下载文件由你保管。</p></div></form>
<section id="intakeResult" class="intake-result" hidden aria-labelledby="resultTitle"><h2 id="resultTitle" tabindex="-1">资料已整理，尚未发送</h2><label for="intakeOutput">检查后再交给运营</label><textarea id="intakeOutput" class="intake-output" readonly></textarea><div class="community-actions"><button type="button" id="copyIntake">复制资料</button><button type="button" id="downloadIntake">下载资料 TXT</button><a class="community-button secondary" href="about.html#contact">打开微信联系入口 ↗</a></div><p id="intakeStatus" class="intake-status" role="status"></p><p class="community-muted">请将文本或文件发给星游集运营。生成、复制或下载均不代表提交成功，资料也不会直接写入项目库。</p></section></main></body></html>
